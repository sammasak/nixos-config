# llm-gateway config: server settings, router tuning, providers and the model
# catalog. Only models that cannot bill by usage can be enabled (enforced at
# parse): `cost_class = "free"`, or `"prepaid-capped"` on a provider whose
# `billing` declares a verified prepaid plan without auto-recharge (owner
# policy 2026-10-17). Routing to prepaid-capped models stops at 00:00 UTC on
# the provider's `billing.expires`.
# Within a tier, catalog order is quality order. Keys are read from files and
# never logged.

[server]
listen = "0.0.0.0:8081"
# /status and /metrics bind separately; the host firewall admits only
# black-pi's Prometheus here. Requires gateway PR #77.
admin_listen = "0.0.0.0:9091"
state_db = "/var/lib/llm-gateway/state.sqlite3"
project_keys_file = "/run/secrets/llm-gateway/project-keys.toml"

[router]
max_attempts = 4     # upstream attempts per client request, failover included
max_wait_secs = 60   # longest cooldown worth waiting out instead of a 429
block_secs = 21600   # 401/402/403/404 block a model for 6h
# Share of each quota group's daily allowance (`rpd`/`tpd`/`npd`) that
# batch projects may not use; they get a 429 until 00:00 UTC once only the
# reserve is left (owner decision 2026-10-15: 30%).
interactive_reserve_percent = 30

# --- projects ----------------------------------------------------------------
# One section per key in the llm-gateway secret's project-keys.toml; a key
# without a section, or a section without a key, stops the gateway. Optional:
# `rpm` (requests started per minute), `daily_tokens` (per UTC day, across
# quota groups), `models` (names it may ask for), `tiers` (1, 2, 3).

[projects.pi]
priority = "interactive"
rpm = 60

[projects.open-webui]
priority = "interactive"
rpm = 30
# Its Ollama connection (/api below) lists the local models by their Ollama
# names. Over /v1 it may use, and /v1/models lists, only the virtual models,
# so chat offers no model twice and no pinned physical cloud model (intended).
models = ["auto", "best", "local"]

[projects.factum]
priority = "batch"
rpm = 10
# About a third of Workers Free's 10k neurons/day (input-heavy estimate; output
# bills higher). The workers-neurons group's npd and the 30% reserve keep factum
# off Pi's share of the CF day; this caps it across groups (llm-gateway#8).
daily_tokens = 60000
# factum pins the physical model its reviewed catalog admits: provenance stays
# exact and the qwen2.5 tokenizer matches its prompt charge (factum cloud.rs).
models = ["cloudflare/@cf/qwen/qwen2.5-coder-32b-instruct"]

[[providers]]
name = "gemini"
kind = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
api_key_file = "/run/secrets/llm-gateway/gemini-api-key"

[[providers]]
name = "cloudflare"
kind = "cloudflare"
base_url = "https://api.cloudflare.com/client/v4/accounts/{account}/ai/v1"
api_key_file = "/run/secrets/llm-gateway/cloudflare-api-token"
account_id_file = "/run/secrets/llm-gateway/cloudflare-account-id"

# Free plan, no card: `x-ratelimit-limit-tokens: 8000` and
# `x-ratelimit-limit-requests: 1000` (probe 2026-10-17). Limits are per model,
# per organization.
[[providers]]
name = "groq"
kind = "openai"
base_url = "https://api.groq.com/openai/v1"
api_key_file = "/run/secrets/llm-gateway/groq-api-key"

# Trial credit with a card on file. No `billing` evidence: auto-recharge was
# never observed off, and the live limits (450 RPM, 150K TPM) are not the
# documented trial's (5 RPM). Stand-in ruling 2026-10-17: keep disabled until
# the console shows no auto-recharge (llm-gateway#13).
[[providers]]
name = "cerebras"
kind = "openai"
base_url = "https://api.cerebras.ai/v1"
api_key_file = "/run/secrets/llm-gateway/cerebras-api-key"

[[providers]]
name = "msi"
kind = "ollama"
# msi: services.ollama on the node itself (#260), bound to its address.
base_url = "http://192.168.10.235:11434/v1"
max_concurrency = 1  # one CPU-bound client saturates msi (Phase 0)
# Both msi models answer `400 "<model>" does not support thinking` to these
# (live 2026-10-15); store, stream_options, parallel_tool_calls and
# max_completion_tokens are accepted (llm-gateway#3).
drop_fields = ["reasoning_effort", "reasoning"]
# Probed every 30s (2s timeout) so /status shows msi unreachable while it is
# off (llm-gateway#4).
health_url = "http://192.168.10.235:11434/api/tags"

# --- Ollama-native passthrough (/api/*) -------------------------------------
# Replaces nginx ollama-router: first reachable backend wins; one whose
# connection fails or that answers 502/503/504 is skipped (a failed connect
# puts it last for 10s, like nginx max_fails). Keyed /api routes on `listen`;
# `local_listen` (loopback only) forwards any path without a key, for
# lenovo's ollama-portforward (PICODE_EP, factum), an SSH forward to it.
[ollama]
local_listen = "127.0.0.1:11435"
backends = [
  # msi: services.ollama on the node itself (#260), bound to its address.
  { name = "msi", url = "http://192.168.10.235:11434" },
  # acer: services.ollama on the node itself (#252), bound to its address.
  { name = "acer", url = "http://192.168.10.110:11434" },
]

