
# asus as tier-3 providers beside msi, Paddock then Ollama: put before llm-gateway.toml only when
# homelab.llmGateway.asus.enable is set (llm-gateway.nix), so the catalog the
# gateway reads without it is the base file alone. asus powers off every night
# and the owner powers it off by hand (sam.fleet.hosts.asus-b460m.power): a
# floor that may be absent. health_url holds its models `unreachable` while it
# is off, a failed connect cools the model and fails over, and nothing starts
# or checks the gateway against it. llm-gateway-asus.nix asserts all of this.
[[providers]]
name = "asus"
kind = "ollama"
# asus: services.ollama on the node itself (sam.fleet.listeners.ollama-asus,
# which admits acer, where the gateway runs).
base_url = "http://@asus@:11434/v1"
# One request slot and one resident model at the 130 W cap
# (docs/records/asus-one-slot-baseline-2026-11-20.md); extra requests queue,
# then fail over as busy.
max_concurrency = 1
drop_fields = ["reasoning_effort", "reasoning"]
health_url = "http://@asus@:11434/api/tags"

# Paddock on asus (modules/homelab/paddock.nix, sam.fleet.listeners.paddock-asus):
# Qwen3.6-35B-A3B with its experts pinned in RAM, 27-30 tok/s decode, one
# sequence at a time. While it runs it holds the GPU, and asus's Ollama serves
# on the CPU. Its health probe holds it unreachable while it is stopped or asus
# is off, and `local` falls to Ollama's model below.
[[providers]]
name = "asus-paddock"
kind = "ollama"
base_url = "http://@asus@:11540/v1"
max_concurrency = 1
health_url = "http://@asus@:11540/healthz"

# One model: Ollama keeps one resident (OLLAMA_MAX_LOADED_MODELS 1), so a
# second would swap weights between requests. Rendered before llm-gateway.toml,
# so it is first in tier 3: `local` and `auto`'s floor try it before msi's CPU.
# qwen3.5:4b, not a pinned gemma4 or qwen2.5-coder: Ollama parses its tool calls
# (parser qwen3.5) where qwen2.5-coder's template leaves plain-text JSON, and at
# 3.3 GB it stays on the GPU at 32K beside its KV cache. Until asus holds the tag
# (homelab.ollama.toolModel.enable there, or `ollama pull qwen3.5:4b`) a call
# gets 404, which blocks the model for block_secs and fails over.
# First in tier 3, so `local` and `auto`'s floor try it before Ollama's model.
# Its id is the GGUF's file stem, which Paddock's /v1/models reports.
[[models]]
provider = "asus-paddock"
id = "Qwen3.6-35B-A3B-UD-Q4_K_XL"
tier = 3
cost_class = "free"
enabled = true
# homelab.paddock.contextLength on asus
context_window = 32768
tool_capable = true
notes = "tool calls by Paddock's qwen35 template, finish_reason tool_calls on asus; Pi tool loop gated by the #620 canary through the gateway (#807)"

[[models]]
provider = "asus"
id = "qwen3.5:4b"
tier = 3
cost_class = "free"
enabled = true
context_window = 32768
# the gate is the #620 canary through the gateway (#494): if it fails, false again sends tool loops back to hosted models
tool_capable = true
notes = "tool calls by Ollama's qwen3.5 parser; Pi tool loop gated by the #620 canary through the gateway (#494)"
