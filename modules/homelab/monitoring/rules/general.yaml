# kube-prometheus-stack 85.0.3's general.rules less InfoInhibitor (info alerts go to no receiver, alertmanager.nix).
# TargetDown's text and runbook are this repo's: upstream's name a namespace and service, absent off Kubernetes. Its
# summary names no job: a group holding two jobs would drop a differing summary from the page. Watchdog is what the
# lenovo watchdog reads from Alertmanager (modules/homelab/cluster-watchdog.nix).
# Each alert's query (docs/alert-runbooks.md) is a copy of its expr, TargetDown's aside: change both.
# TargetDown leaves out the targets of a node off as planned (homelab:node:off_as_planned, homelab.yaml), which
# upstream's does not: a sleeping host powered off at night is not a target down.
groups:
  - name: general.rules
    rules:
      - alert: TargetDown
        annotations:
          description: '{{ printf "%.4g" $value }}% of the {{ $labels.job }} targets have not answered black-pi''s scrape for 10 minutes. The query lists them and http://prometheus.fleet.sammasak.dev:9090/targets?search={{ $labels.job }} shows each one''s error; a node-exporter target down is also NodeChronicNotReady''s page for that host.'
          query: up == 0 unless on (node) homelab:node:off_as_planned
          runbook_url: https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#targetdown
          summary: Scrape targets are unreachable.
        expr: 100 * (count(up == 0 unless on (node) homelab:node:off_as_planned) BY (cluster, job, namespace, service) / count(up unless on (node) homelab:node:off_as_planned) BY (cluster, job, namespace, service)) > 10
        for: 10m
        labels:
          severity: warning
      - alert: Watchdog
        annotations:
          description: 'This is an alert meant to ensure that the entire alerting pipeline is functional.

            This alert is always firing, therefore it should always be firing in Alertmanager

            and always fire against a receiver. There are integrations with various notification

            mechanisms that send a notification when this alert is not firing. For example the

            "DeadMansSnitch" integration in PagerDuty.

'
          query: vector(1)
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/general/watchdog
          summary: An alert that should always be firing to certify that Alertmanager is working properly.
        expr: vector(1)
        labels:
          severity: none
