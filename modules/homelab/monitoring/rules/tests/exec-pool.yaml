        values: '1x30'
      - series: 'codex_egress_access_token_expiry_timestamp_seconds{job="node-exporter",node="acer-swift"}'
        values: '86400x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: CodexLoginRefreshFailed
        exp_alerts: []
      - eval_time: 16m
        alertname: CodexLoginRefreshFailed
        exp_alerts:
          - exp_labels: {severity: warning, team: homelab, node: acer-swift}
            exp_annotations:
              summary: "The pool's Codex login on acer-swift failed to refresh"
              description: 'The owner''s ChatGPT login the egress proxy signs the slots'' Codex calls with on acer-swift failed or timed out on its refresh, or its access token expires within the hour, and nothing retries it: Codex tasks there will fail with 401. Sign in again on acer-swift as lukas, the login''s one writer: codex login --device-auth, which rewrites /home/lukas/.codex/auth.json (runbook).'
              query: 'codex_egress_refresh_failed{job="node-exporter",node="acer-swift"} or codex_egress_access_token_expiry_timestamp_seconds{job="node-exporter",node="acer-swift"} - time()'
              runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#codexloginrefreshfailed"

