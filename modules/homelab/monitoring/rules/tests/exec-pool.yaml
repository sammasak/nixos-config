# promtool test rules for exec-pool.yaml (flake-modules/monitoring-check.nix runs it). acer runs the queue; lenovo
# does not and has another textfile.
rule_files: [../exec-pool.yaml]
evaluation_interval: 1m
tests:
  # an empty queue, rewritten every minute: never fires
  - interval: 1m
    input_series:
      - series: 'exec_pool_queue_up{job="node-exporter",node="acer-swift"}'
        values: '1x120'
      - series: 'exec_pool_attempts{job="node-exporter",node="acer-swift",state="queued"}'
        values: '0x120'
      - series: 'node_textfile_mtime_seconds{job="node-exporter",node="acer-swift",file="/var/lib/exec-pool-metrics/exec-pool.prom"}'
        values: '0+60x120'
      - series: 'node_textfile_mtime_seconds{job="node-exporter",node="lenovo-21CB001PMX",file="/run/node-exporter-textfile/adguard.prom"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 120m
        alertname: ExecPoolQueueDown
        exp_alerts: []

  # the database stops answering at 10m: up 0 from then, firing 10m later
  - interval: 1m
    input_series:
      - series: 'exec_pool_queue_up{job="node-exporter",node="acer-swift"}'
        values: '1x10 0x30'
      - series: 'node_textfile_mtime_seconds{job="node-exporter",node="acer-swift",file="/var/lib/exec-pool-metrics/exec-pool.prom"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: ExecPoolQueueDown
        exp_alerts: []
      - eval_time: 21m
        alertname: ExecPoolQueueDown
        exp_alerts:
          - exp_labels: {severity: warning, team: homelab, node: acer-swift}
            exp_annotations:
              summary: "The execution pool queue on acer-swift is unreachable"
              description: "exec-pool-metrics on acer-swift has not reached the queue's database for 10 minutes, or has not rewritten its textfile for over 10 minutes, so the queue's counts read absent. Run systemctl status postgresql.service exec-pool-migrate.service exec-pool-metrics.service there."
              query: 'exec_pool_queue_up{job="node-exporter",node="acer-swift"}'
              runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#execpoolqueuedown"

  # the timer stops at 600 s with the last file saying up 1: older than 600 s from 20m, firing 10m later
  - interval: 1m
    input_series:
      - series: 'exec_pool_queue_up{job="node-exporter",node="acer-swift"}'
        values: '1x60'
      - series: 'node_textfile_mtime_seconds{job="node-exporter",node="acer-swift",file="/var/lib/exec-pool-metrics/exec-pool.prom"}'
        values: '0+60x10 600x50'
    alert_rule_test:
      - eval_time: 25m
        alertname: ExecPoolQueueDown
        exp_alerts: []
      - eval_time: 31m
        alertname: ExecPoolQueueDown
        exp_alerts:
          - exp_labels: {severity: warning, team: homelab, node: acer-swift}
            exp_annotations:
              summary: "The execution pool queue on acer-swift is unreachable"
              description: "exec-pool-metrics on acer-swift has not reached the queue's database for 10 minutes, or has not rewritten its textfile for over 10 minutes, so the queue's counts read absent. Run systemctl status postgresql.service exec-pool-migrate.service exec-pool-metrics.service there."
              query: 'exec_pool_queue_up{job="node-exporter",node="acer-swift"}'
              runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#execpoolqueuedown"

  # the host sleeps from 10m: no series, no alert
  - interval: 1m
    input_series:
      - series: 'exec_pool_queue_up{job="node-exporter",node="acer-swift"}'
        values: '1x10 _x50'
      - series: 'node_textfile_mtime_seconds{job="node-exporter",node="acer-swift",file="/var/lib/exec-pool-metrics/exec-pool.prom"}'
        values: '0+60x10 _x50'
    alert_rule_test:
      - eval_time: 60m
        alertname: ExecPoolQueueDown
        exp_alerts: []

  # a lease goes overdue at 10m and is reconciled at 40m: firing from 20m, gone after
  - interval: 1m
    input_series:
      - series: 'exec_pool_lease_overdue{job="node-exporter",node="acer-swift",state="running"}'
        values: '0x10 1x30 0x20'
      - series: 'exec_pool_lease_overdue{job="node-exporter",node="acer-swift",state="leased"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 15m
        alertname: ExecPoolLeaseOverdue
        exp_alerts: []
      - eval_time: 21m
        alertname: ExecPoolLeaseOverdue
        exp_alerts:
          - exp_labels: {severity: warning, team: homelab, node: acer-swift}
            exp_annotations:
              summary: "An execution pool task on acer-swift is stuck past its lease deadline"
              description: "1 attempt(s) in the queue on acer-swift have been leased, running or checkpointing past their lease deadline for 10 minutes without a reconcile expiring them, so nothing runs or requeues them. Once no runner holds it, run exec-pool-queue reconcile there as the exec_pool user (runbook)."
              query: 'exec_pool_lease_overdue{job="node-exporter",node="acer-swift"} > 0'
              runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#execpoolleaseoverdue"
      - eval_time: 45m
        alertname: ExecPoolLeaseOverdue
        exp_alerts: []

  # one attempt needs review from 10m: quiet at 69m, firing at 71m; an idle queue never fires
  - interval: 1m
    input_series:
      - series: 'exec_pool_attempts{job="node-exporter",node="acer-swift",state="needs_review",agent="claude"}'
        values: '0x10 1x80'
      - series: 'exec_pool_attempts{job="node-exporter",node="acer-swift",state="needs_review",agent="none"}'
        values: '0x90'
      - series: 'exec_pool_attempts{job="node-exporter",node="acer-swift",state="queued",agent="claude"}'
        values: '3x90'
    alert_rule_test:
      - eval_time: 69m
        alertname: ExecPoolNeedsReview
        exp_alerts: []
      - eval_time: 71m
        alertname: ExecPoolNeedsReview
        exp_alerts:
          - exp_labels: {severity: warning, team: homelab, node: acer-swift}
            exp_annotations:
              summary: "Execution pool tasks on acer-swift wait for an operator's review"
              description: "1 attempt(s) in the queue on acer-swift have been in needs_review for an hour: a started attempt lost its lease or settled as such, and its effects are unknown. List it with psql as the exec_pool user, check its effects, then resolve it (runbook)."
              query: 'exec_pool_attempts{job="node-exporter",node="acer-swift",state="needs_review"} > 0'
              runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#execpoolneedsreview"
