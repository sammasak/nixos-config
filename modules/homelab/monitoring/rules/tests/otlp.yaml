# promtool test rules for homelab.yaml's OTLP rejection alert (flake-modules/monitoring-check.nix runs it).
rule_files: [../homelab.yaml]
evaluation_interval: 1m
tests:
  # Thursday 00:00 UTC onward: a relay's token no longer matches, a 401 per minute; accepted posts carry on beside it
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="alloy-otlp",instance="192.168.10.110:12346",component_id="otelcol.receiver.otlp.native",http_response_status_code="200"}'
        values: '0+10x40'
      - series: 'http_server_request_duration_seconds_count{job="alloy-otlp",instance="192.168.10.110:12346",component_id="otelcol.receiver.otlp.native",http_response_status_code="401"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 8m
        alertname: OtlpWritesRejected
        exp_alerts: []
      - eval_time: 15m
        alertname: OtlpWritesRejected
        exp_alerts:
          - exp_labels: {severity: warning, team: homelab, http_response_status_code: "401"}
            exp_annotations:
              summary: "alloy-otlp on acer-swift is answering OTLP posts with 401"
              description: "acer's OTLP receiver answered 5 posts (metrics and logs from the host relays) with HTTP 401 in the last 5 minutes, and has kept doing so for 10 minutes: those writes are lost while every scrape stays green. Run journalctl -u alloy-otlp --since -30m on acer."
              query: 'sum by (http_response_status_code) (increase(http_server_request_duration_seconds_count{job="alloy-otlp",component_id="otelcol.receiver.otlp.native"}[1h]))'
              runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#otlpwritesrejected"

  # absent: no error series exists until Alloy first answers one (a fresh start answers only 200s); a 400 class that
  # appears at minute 20 and keeps growing is caught once it has two samples
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="alloy-otlp",instance="192.168.10.110:12346",component_id="otelcol.receiver.otlp.native",http_response_status_code="200"}'
        values: '0+10x60'
      - series: 'http_server_request_duration_seconds_count{job="alloy-otlp",instance="192.168.10.110:12346",component_id="otelcol.receiver.otlp.native",http_response_status_code="400"}'
        values: '_x20 1+2x40'
    alert_rule_test:
      - eval_time: 19m
        alertname: OtlpWritesRejected
        exp_alerts: []
      - eval_time: 33m
        alertname: OtlpWritesRejected
        exp_alerts:
          - exp_labels: {severity: warning, team: homelab, http_response_status_code: "400"}
            exp_annotations:
              summary: "alloy-otlp on acer-swift is answering OTLP posts with 400"
              description: "acer's OTLP receiver answered 10 posts (metrics and logs from the host relays) with HTTP 400 in the last 5 minutes, and has kept doing so for 10 minutes: those writes are lost while every scrape stays green. Run journalctl -u alloy-otlp --since -30m on acer."
              query: 'sum by (http_response_status_code) (increase(http_server_request_duration_seconds_count{job="alloy-otlp",component_id="otelcol.receiver.otlp.native"}[1h]))'
              runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#otlpwritesrejected"

  # msi powers off at 19:00 UTC (21:00 local) and asus with it: their relays' last posts are cut off, a burst of 400s,
  # then neither sends anything all night; the series stays flat and nothing fires
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="alloy-otlp",instance="192.168.10.110:12346",component_id="otelcol.receiver.otlp.native",http_response_status_code="200"}'
        values: '0+10x1200'
      - series: 'http_server_request_duration_seconds_count{job="alloy-otlp",instance="192.168.10.110:12346",component_id="otelcol.receiver.otlp.native",http_response_status_code="400"}'
        values: '0x1140 6x60'
    alert_rule_test:
      - eval_time: 19h4m
        alertname: OtlpWritesRejected
        exp_alerts: []
      - eval_time: 19h12m
        alertname: OtlpWritesRejected
        exp_alerts: []
      - eval_time: 19h30m
        alertname: OtlpWritesRejected
        exp_alerts: []
