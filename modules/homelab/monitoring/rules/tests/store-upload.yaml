# promtool test rules for homelab.yaml's store upload alert (flake-modules/monitoring-check.nix runs it). The textfile
# as store-upload writes it on each try, every 10 minutes while acer refuses, scraped each minute.
rule_files: [../homelab.yaml]
evaluation_interval: 1m
tests:
  # msi's queue stays at 3 with no success; at 100m a send goes through. asus never sent and has nothing queued.
  - interval: 1m
    input_series:
      - series: 'up{job="node-exporter",instance="acer-swift",node="acer-swift"}'
        values: '1x130'
      - series: 'up{job="node-exporter",instance="msi-ms7758",node="msi-ms7758",sleeps="true"}'
        values: '1x130'
      - series: 'store_upload_queue_paths{job="node-exporter",instance="msi-ms7758",node="msi-ms7758",sleeps="true"}'
        values: '3x100 0x30'
      - series: 'store_upload_last_success_timestamp_seconds{job="node-exporter",instance="msi-ms7758",node="msi-ms7758",sleeps="true"}'
        values: '0x100 6000x30'
      - series: 'up{job="node-exporter",instance="asus-b460m",node="asus-b460m",sleeps="true"}'
        values: '1x130'
      - series: 'store_upload_queue_paths{job="node-exporter",instance="asus-b460m",node="asus-b460m",sleeps="true"}'
        values: '0x130'
      - series: 'store_upload_last_success_timestamp_seconds{job="node-exporter",instance="asus-b460m",node="asus-b460m",sleeps="true"}'
        values: '0x130'
    alert_rule_test:
      - eval_time: 85m
        alertname: StoreUploadStuck
        exp_alerts: []
      - eval_time: 95m
        alertname: StoreUploadStuck
        exp_alerts:
          - exp_labels: {severity: warning, team: homelab, node: msi-ms7758}
            exp_annotations:
              summary: "msi-ms7758 has 3 built paths acer-swift has not taken"
              description: "store-upload on msi-ms7758 has had 3 built paths queued for acer-swift and no batch taken for over an hour, for 30 minutes while both hosts are up, so those builds are not in acer's cache and go with the next power-off. Run systemctl status store-upload.path store-upload.timer store-upload on msi-ms7758, then journalctl -u store-upload -n 20 and read the line 'store-upload: acer-swift did not take N paths'. Owning issue: sammasak/nixos-config#835."
              query: '{__name__=~"store_upload_queue_paths|store_upload_last_success_timestamp_seconds",job="node-exporter",node="msi-ms7758"}'
              runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#storeuploadstuck"
      - eval_time: 105m
        alertname: StoreUploadStuck
        exp_alerts: []

  # msi powers off at 20m with 5 paths queued; its samples are held past the power-off (not what a failed scrape
  # gives, which marks them stale) so the up guard alone keeps it silent
  - interval: 1m
    input_series:
      - series: 'up{job="node-exporter",instance="acer-swift",node="acer-swift"}'
        values: '1x150'
      - series: 'up{job="node-exporter",instance="msi-ms7758",node="msi-ms7758",sleeps="true"}'
        values: '1x20 0x130'
      - series: 'store_upload_queue_paths{job="node-exporter",instance="msi-ms7758",node="msi-ms7758",sleeps="true"}'
        values: '5x150'
      - series: 'store_upload_last_success_timestamp_seconds{job="node-exporter",instance="msi-ms7758",node="msi-ms7758",sleeps="true"}'
        values: '0x150'
    alert_rule_test:
      - eval_time: 120m
        alertname: StoreUploadStuck
        exp_alerts: []

  # acer is down: the queue cannot drain and that is acer's alert, not the sender's
  - interval: 1m
    input_series:
      - series: 'up{job="node-exporter",instance="acer-swift",node="acer-swift"}'
        values: '0x150'
      - series: 'up{job="node-exporter",instance="asus-b460m",node="asus-b460m",sleeps="true"}'
        values: '1x150'
      - series: 'store_upload_queue_paths{job="node-exporter",instance="asus-b460m",node="asus-b460m",sleeps="true"}'
        values: '4x150'
      - series: 'store_upload_last_success_timestamp_seconds{job="node-exporter",instance="asus-b460m",node="asus-b460m",sleeps="true"}'
        values: '0x150'
    alert_rule_test:
      - eval_time: 120m
        alertname: StoreUploadStuck
        exp_alerts: []

  # asus took a batch at 50m and its next try fails from 55m: silent until an hour after that success plus the 30m
  - interval: 1m
    input_series:
      - series: 'up{job="node-exporter",instance="acer-swift",node="acer-swift"}'
        values: '1x150'
      - series: 'up{job="node-exporter",instance="asus-b460m",node="asus-b460m",sleeps="true"}'
        values: '1x150'
      - series: 'store_upload_queue_paths{job="node-exporter",instance="asus-b460m",node="asus-b460m",sleeps="true"}'
        values: '0x55 2x95'
      - series: 'store_upload_last_success_timestamp_seconds{job="node-exporter",instance="asus-b460m",node="asus-b460m",sleeps="true"}'
        values: '0x50 3000x100'
    alert_rule_test:
      - eval_time: 135m
        alertname: StoreUploadStuck
        exp_alerts: []
      - eval_time: 145m
        alertname: StoreUploadStuck
        exp_alerts:
          - exp_labels: {severity: warning, team: homelab, node: asus-b460m}
            exp_annotations:
              summary: "asus-b460m has 2 built paths acer-swift has not taken"
              description: "store-upload on asus-b460m has had 2 built paths queued for acer-swift and no batch taken for over an hour, for 30 minutes while both hosts are up, so those builds are not in acer's cache and go with the next power-off. Run systemctl status store-upload.path store-upload.timer store-upload on asus-b460m, then journalctl -u store-upload -n 20 and read the line 'store-upload: acer-swift did not take N paths'. Owning issue: sammasak/nixos-config#835."
              query: '{__name__=~"store_upload_queue_paths|store_upload_last_success_timestamp_seconds",job="node-exporter",node="asus-b460m"}'
              runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#storeuploadstuck"

  # /var fills on msi at 30m: its tries stop before the textfile write, so the queue reads 0 and the mtime stays 1800.
  # Stale past 1800 s from 61m, firing 30m later. asus keeps writing every 10 minutes; acer's own file (the retain
  # job's, no queue gauge) is older still and stays silent.
  - interval: 1m
    input_series:
      - series: 'up{job="node-exporter",instance="acer-swift",node="acer-swift"}'
        values: '1x130'
      - series: 'node_textfile_mtime_seconds{job="node-exporter",instance="acer-swift",node="acer-swift",file="/run/node-exporter-textfile/store-upload.prom"}'
        values: '0x130'
      - series: 'up{job="node-exporter",instance="msi-ms7758",node="msi-ms7758",sleeps="true"}'
        values: '1x130'
      - series: 'store_upload_queue_paths{job="node-exporter",instance="msi-ms7758",node="msi-ms7758",sleeps="true"}'
        values: '0x130'
      - series: 'node_textfile_mtime_seconds{job="node-exporter",instance="msi-ms7758",node="msi-ms7758",sleeps="true",file="/run/node-exporter-textfile/store-upload.prom"}'
        values: '0x9 600x9 1200x9 1800x100'
      - series: 'up{job="node-exporter",instance="asus-b460m",node="asus-b460m",sleeps="true"}'
        values: '1x130'
      - series: 'store_upload_queue_paths{job="node-exporter",instance="asus-b460m",node="asus-b460m",sleeps="true"}'
        values: '0x130'
      - series: 'node_textfile_mtime_seconds{job="node-exporter",instance="asus-b460m",node="asus-b460m",sleeps="true",file="/run/node-exporter-textfile/store-upload.prom"}'
        values: '0x9 600x9 1200x9 1800x9 2400x9 3000x9 3600x9 4200x9 4800x9 5400x9 6000x9 6600x9 7200x9 7800x9'
    alert_rule_test:
      - eval_time: 90m
        alertname: StoreUploadStale
        exp_alerts: []
      - eval_time: 91m
        alertname: StoreUploadStale
        exp_alerts:
          - exp_labels: {severity: warning, team: homelab, node: msi-ms7758}
            exp_annotations:
              summary: "store-upload on msi-ms7758 has stopped writing its gauges"
              description: "store-upload on msi-ms7758 has not rewritten /run/node-exporter-textfile/store-upload.prom for over 30 minutes, or has not written it since boot, for 30 minutes while both hosts are up: its tries fail before the write, so the queue gauge is stale and StoreUploadStuck cannot fire while its builds stop reaching acer-swift. Run df -h /var and journalctl -u store-upload -n 20 on msi-ms7758. Owning issue: sammasak/nixos-config#835."
              query: 'time() - node_textfile_mtime_seconds{job="node-exporter",node="msi-ms7758",file=~".*/store-upload[.]prom"}'
              runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#storeuploadstuck"
      - eval_time: 125m
        alertname: StoreUploadStuck
        exp_alerts: []

  # msi's file stops at 30m as above, but msi powers off at 40m; its samples are held, so the up guard alone keeps it silent
  - interval: 1m
    input_series:
      - series: 'up{job="node-exporter",instance="acer-swift",node="acer-swift"}'
        values: '1x130'
      - series: 'up{job="node-exporter",instance="msi-ms7758",node="msi-ms7758",sleeps="true"}'
        values: '1x40 0x90'
      - series: 'store_upload_queue_paths{job="node-exporter",instance="msi-ms7758",node="msi-ms7758",sleeps="true"}'
        values: '0x130'
      - series: 'node_textfile_mtime_seconds{job="node-exporter",instance="msi-ms7758",node="msi-ms7758",sleeps="true",file="/run/node-exporter-textfile/store-upload.prom"}'
        values: '0x9 600x9 1200x9 1800x100'
    alert_rule_test:
      - eval_time: 125m
        alertname: StoreUploadStale
        exp_alerts: []

  # asus reboots at 30m onto a full /var: no try writes the file in /run again, so neither it nor the queue gauge is
  # served from 31m and the 5m lookback leaves them at 36m; the gauge from before the boot marks asus a sender.
  # Past 30 minutes of uptime from 61m, firing 30m later.
  - interval: 1m
    input_series:
      - series: 'up{job="node-exporter",instance="acer-swift",node="acer-swift"}'
        values: '1x130'
      - series: 'up{job="node-exporter",instance="asus-b460m",node="asus-b460m",sleeps="true"}'
        values: '1x130'
      - series: 'store_upload_queue_paths{job="node-exporter",instance="asus-b460m",node="asus-b460m",sleeps="true"}'
        values: '0x30 _x100'
      - series: 'node_textfile_mtime_seconds{job="node-exporter",instance="asus-b460m",node="asus-b460m",sleeps="true",file="/run/node-exporter-textfile/store-upload.prom"}'
        values: '0+60x30 _x100'
      - series: 'node_boot_time_seconds{job="node-exporter",instance="asus-b460m",node="asus-b460m",sleeps="true"}'
        values: '-86400x30 1800x100'
    alert_rule_test:
      - eval_time: 90m
        alertname: StoreUploadStale
        exp_alerts: []
      - eval_time: 91m
        alertname: StoreUploadStale
        exp_alerts:
          - exp_labels: {severity: warning, team: homelab, node: asus-b460m}
            exp_annotations:
              summary: "store-upload on asus-b460m has stopped writing its gauges"
              description: "store-upload on asus-b460m has not rewritten /run/node-exporter-textfile/store-upload.prom for over 30 minutes, or has not written it since boot, for 30 minutes while both hosts are up: its tries fail before the write, so the queue gauge is stale and StoreUploadStuck cannot fire while its builds stop reaching acer-swift. Run df -h /var and journalctl -u store-upload -n 20 on asus-b460m. Owning issue: sammasak/nixos-config#835."
              query: 'time() - node_textfile_mtime_seconds{job="node-exporter",node="asus-b460m",file=~".*/store-upload[.]prom"}'
              runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#storeuploadstuck"

  # acer is down while msi's file is stale: the upload cannot land anyway, and that is acer's alert
  - interval: 1m
    input_series:
      - series: 'up{job="node-exporter",instance="acer-swift",node="acer-swift"}'
        values: '0x130'
      - series: 'up{job="node-exporter",instance="msi-ms7758",node="msi-ms7758",sleeps="true"}'
        values: '1x130'
      - series: 'store_upload_queue_paths{job="node-exporter",instance="msi-ms7758",node="msi-ms7758",sleeps="true"}'
        values: '0x130'
      - series: 'node_textfile_mtime_seconds{job="node-exporter",instance="msi-ms7758",node="msi-ms7758",sleeps="true",file="/run/node-exporter-textfile/store-upload.prom"}'
        values: '0x9 600x9 1200x9 1800x100'
    alert_rule_test:
      - eval_time: 125m
        alertname: StoreUploadStale
        exp_alerts: []

  # msi's weekend: last served at 10m, off until 60h (3600m), and it boots onto a full /var. Its queue gauge, 60 h old,
  # still marks it a sender in the 4d window (1d would not); silent through the boot grace, firing 30m after it.
  - interval: 1m
    input_series:
      - series: 'up{job="node-exporter",instance="acer-swift",node="acer-swift"}'
        values: '1x3800'
      - series: 'up{job="node-exporter",instance="msi-ms7758",node="msi-ms7758",sleeps="true"}'
        values: '1x10 0x3589 1x200'
      - series: 'store_upload_queue_paths{job="node-exporter",instance="msi-ms7758",node="msi-ms7758",sleeps="true"}'
        values: '0x10'
      - series: 'node_textfile_mtime_seconds{job="node-exporter",instance="msi-ms7758",node="msi-ms7758",sleeps="true",file="/run/node-exporter-textfile/store-upload.prom"}'
        values: '0+60x10'
      - series: 'node_boot_time_seconds{job="node-exporter",instance="msi-ms7758",node="msi-ms7758",sleeps="true"}'
        values: '-86400x10 _x3589 216000x200'
    alert_rule_test:
      - eval_time: 3660m
        alertname: StoreUploadStale
        exp_alerts: []
      - eval_time: 3661m
        alertname: StoreUploadStale
        exp_alerts:
          - exp_labels: {severity: warning, team: homelab, node: msi-ms7758}
            exp_annotations:
              summary: "store-upload on msi-ms7758 has stopped writing its gauges"
              description: "store-upload on msi-ms7758 has not rewritten /run/node-exporter-textfile/store-upload.prom for over 30 minutes, or has not written it since boot, for 30 minutes while both hosts are up: its tries fail before the write, so the queue gauge is stale and StoreUploadStuck cannot fire while its builds stop reaching acer-swift. Run df -h /var and journalctl -u store-upload -n 20 on msi-ms7758. Owning issue: sammasak/nixos-config#835."
              query: 'time() - node_textfile_mtime_seconds{job="node-exporter",node="msi-ms7758",file=~".*/store-upload[.]prom"}'
              runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#storeuploadstuck"
