# promtool test rules for homelab.yaml's temperature alerts (flake-modules/monitoring-check.nix runs it).
rule_files: [../homelab.yaml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      # a Pi zone at its throttle point
      - series: 'node_thermal_zone_temp{job="node-exporter",node="black-pi",type="cpu-thermal",zone="0"}'
        values: '70x10 86x30'
      # an x86 package zone through a long build: hwmon judges x86 hosts, so it stays silent
      - series: 'node_thermal_zone_temp{job="node-exporter",node="acer-swift",type="x86_pkg_temp",zone="1"}'
        values: '89x40'
      - series: 'nvidia_smi_clocks_event_reasons_hw_thermal_slowdown{job="nvidia-gpu",node="asus-b460m",uuid="GPU-0"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: NodeTemperatureHigh
        exp_alerts: []
      - eval_time: 30m
        alertname: NodeTemperatureHigh
        exp_alerts:
          - exp_labels: {severity: warning, team: homelab, job: node-exporter, node: black-pi, type: cpu-thermal, zone: "0"}
            exp_annotations:
              summary: "black-pi runs hot"
              description: "black-pi's cpu-thermal zone has read 86 °C for 15 minutes, at the Pi's throttle point. Check the fan and airflow; Hosts shows the hottest sensor."
              query: 'node_thermal_zone_temp{job="node-exporter",node="black-pi"}'
              runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#nodetemperaturehigh"
      - eval_time: 18m
        alertname: GpuThermalThrottling
        exp_alerts: []
      - eval_time: 25m
        alertname: GpuThermalThrottling
        exp_alerts:
          - exp_labels: {severity: warning, team: homelab, job: nvidia-gpu, node: asus-b460m, uuid: GPU-0}
            exp_annotations:
              summary: "The GPU on asus-b460m slows itself for heat"
              description: "The board on asus-b460m has reported hardware thermal slowdown for 10 minutes: model runs are slower than measured. Run nvidia-smi -q -d TEMPERATURE,PERFORMANCE there; the GPU dashboard shows its temperature, fan and power."
              query: 'nvidia_smi_temperature_gpu{job="nvidia-gpu",node="asus-b460m"}'
              runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#gputhermalthrottling"
  # msi through a gate: 102 °C against a 105 °C mark for 20 minutes. NodeTemperatureHigh stays silent
  - interval: 1m
    input_series:
      - series: 'node_hwmon_temp_celsius{job="node-exporter",node="msi-ms7758",chip="platform_coretemp_0",sensor="temp1"}'
        values: '102x40'
      - series: 'node_hwmon_temp_crit_celsius{job="node-exporter",node="msi-ms7758",chip="platform_coretemp_0",sensor="temp1"}'
        values: '105x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: NodeTemperatureHigh
        exp_alerts: []
