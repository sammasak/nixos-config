# The execution pool queue's alerts (modules/homelab/exec-pool.nix). They key on the collector's own textfile, which
# exists only on a host that runs the queue and only while that host is scraped: an empty queue is up 1 with zero
# counts and never fires, and a sleeping host never does. A failed collector unit is SystemdUnitFailed's.
groups:
  - name: exec-pool.alerts
    rules:
      - alert: ExecPoolQueueDown
        # 600 s is ten missed minutely runs
        expr: |
          max by (node) (exec_pool_queue_up{job="node-exporter"} == 0)
          or max by (node) (time() - node_textfile_mtime_seconds{job="node-exporter",file=~".*/exec-pool[.]prom"} > 600)
        for: 10m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "The execution pool queue on {{ $labels.node }} is unreachable"
          description: "exec-pool-metrics on {{ $labels.node }} has not reached the queue's database for 10 minutes, or has not rewritten its textfile for over 10 minutes, so the queue's counts read absent. Run systemctl status postgresql.service exec-pool-migrate.service exec-pool-metrics.service there."
          query: 'exec_pool_queue_up{job="node-exporter",node="{{ $labels.node }}"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#execpoolqueuedown"

      - alert: ExecPoolLeaseOverdue
        # a live lease past its deadline: the runner died or stopped reconciling; the task neither runs nor requeues
        expr: |
          sum by (node) (exec_pool_lease_overdue{job="node-exporter"}) > 0
        for: 10m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "An execution pool task on {{ $labels.node }} is stuck past its lease deadline"
          description: "{{ $value }} attempt(s) in the queue on {{ $labels.node }} have been leased, running or checkpointing past their lease deadline for 10 minutes without a reconcile expiring them, so nothing runs or requeues them. Once no runner holds it, run exec-pool-queue reconcile there as the exec_pool user (runbook)."
          query: 'exec_pool_lease_overdue{job="node-exporter",node="{{ $labels.node }}"} > 0'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#execpoolleaseoverdue"

      - alert: ExecPoolNeedsReview
        # an expired started attempt whose effects are unknown; only an operator's resolve closes it
        expr: |
          sum by (node) (exec_pool_attempts{job="node-exporter",state="needs_review"}) > 0
        for: 1h
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "Execution pool tasks on {{ $labels.node }} wait for an operator's review"
          description: "{{ $value }} attempt(s) in the queue on {{ $labels.node }} have been in needs_review for an hour: a started attempt lost its lease or settled as such, and its effects are unknown. List it with psql as the exec_pool user, check its effects, then resolve it (runbook)."
          query: 'exec_pool_attempts{job="node-exporter",node="{{ $labels.node }}",state="needs_review"} > 0'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#execpoolneedsreview"
