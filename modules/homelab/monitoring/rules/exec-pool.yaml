# The execution pool queue's alerts (modules/homelab/exec-pool.nix). The queue's series come from the collector's own
# textfile, which exists only on a host that runs the queue and only while that host is scraped: an empty queue is up 1
# with zero counts and never fires. Their host label is the slot's host (the queue renders every host's on acer); the
# park push, prepare and memory kill counters are each slot host's own textfile, split by node. A failed collector unit is
# SystemdUnitFailed's.
groups:
  # #626's compaction window comparison: Claude turns by the arm their slot declared (variant: its autoCompactWindow
  # or default; shunt), over a day. A session whose turns ran under two arms counts on each
  # (exec_pool_sessions_mixed_arms_last_day); unknown is a turn from before.
  - name: exec-pool.variants
    rules:
      - record: host_variant:exec_pool_session_turns:increase1d
        expr: |
          sum by (host, variant, shunt) (increase(exec_pool_session_turns_reported_total{job="node-exporter",agent="claude"}[1d]))
      # sessions with a reported turn in the last day, not new ones: sessions last for days
      - record: host_variant:exec_pool_sessions:1d
        expr: |
          sum by (host, variant, shunt) (exec_pool_sessions_reported_last_day{job="node-exporter",agent="claude"})
      # uncached input, output, cache read and cache creation together
      - record: host_variant:exec_pool_session_tokens:increase1d
        expr: |
          sum by (host, variant, shunt) (increase(exec_pool_session_input_tokens_total{job="node-exporter",agent="claude"}[1d]))
          + sum by (host, variant, shunt) (increase(exec_pool_session_output_tokens_total{job="node-exporter",agent="claude"}[1d]))
          + sum by (host, variant, shunt) (increase(exec_pool_session_cache_read_tokens_total{job="node-exporter",agent="claude"}[1d]))
          + sum by (host, variant, shunt) (increase(exec_pool_session_cache_creation_tokens_total{job="node-exporter",agent="claude"}[1d]))
      - record: host_variant:exec_pool_session_cost_usd:increase1d
        expr: |
          sum by (host, variant, shunt) (increase(exec_pool_session_cost_usd_total{job="node-exporter",agent="claude"}[1d]))
      # turns parked as turn_error, turn_timeout or turn_memory_kill: they report no usage, so the turns record misses them
      - record: host_variant:exec_pool_session_turn_errors:increase1d
        expr: |
          sum by (host, variant, shunt) (increase(exec_pool_session_turn_errors_total{job="node-exporter",agent="claude"}[1d]))

  - name: exec-pool.alerts
    rules:
      - alert: ExecPoolQueueDown
        # 600 s is ten missed minutely runs
        expr: |
          max by (node) (exec_pool_queue_up{job="node-exporter"} == 0)
          or max by (node) (time() - node_textfile_mtime_seconds{job="node-exporter",file=~".*/exec-pool[.]prom"} > 600)
        for: 10m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "The execution pool queue on {{ $labels.node }} is unreachable"
          description: "exec-pool-metrics on {{ $labels.node }} has not reached the queue's database for 10 minutes, or has not rewritten its textfile for over 10 minutes, so the queue's counts read absent. Run systemctl status postgresql.service exec-pool-migrate.service exec-pool-metrics.service there."
          query: 'exec_pool_queue_up{job="node-exporter",node="{{ $labels.node }}"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#execpoolqueuedown"

      - alert: ExecPoolLeaseOverdue
        # a live lease past its deadline: the runner died or stopped reconciling; the task neither runs nor requeues
        expr: |
          sum by (host) (exec_pool_lease_overdue{job="node-exporter"}) > 0
        for: 10m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "An execution pool task on {{ $labels.host }} is stuck past its lease deadline"
          description: "{{ $value }} attempt(s) on {{ $labels.host }}'s slots have been leased, running or checkpointing past their lease deadline for 10 minutes without a reconcile expiring them, so nothing runs or requeues them. Once no runner holds it, run exec-pool-queue reconcile on the queue's host as the exec_pool user (runbook)."
          query: 'exec_pool_lease_overdue{job="node-exporter",host="{{ $labels.host }}"} > 0'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#execpoolleaseoverdue"

      - alert: ExecPoolNeedsReview
        # an expired started attempt whose effects are unknown; only an operator's resolve, or a session's send, moves it
        expr: |
          sum by (host) (exec_pool_attempts{job="node-exporter",state="needs_review"}) > 0
        for: 30m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "Execution pool tasks last run on {{ $labels.host }} wait for an operator's review"
          description: "{{ $value }} attempt(s) or session(s) last run on {{ $labels.host }} have been in needs_review for 30 minutes: a started attempt lost its lease or settled as such, and its effects are unknown. List it with psql as the exec_pool user, check its effects, then resolve it, or send a session on (runbook)."
          query: 'exec_pool_attempts{job="node-exporter",host="{{ $labels.host }}",state="needs_review"} > 0'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#execpoolneedsreview"

      - alert: ExecPoolSlotQuarantined
        # a refused reset (an agent running, or unpushed work): the runner stays up but claims nothing for that slot
        expr: |
          max by (host) (exec_pool_slots{job="node-exporter",state="quarantined"}) > 0
        for: 5m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "An execution pool slot on {{ $labels.host }} is quarantined"
          description: "{{ $value }} slot(s) on {{ $labels.host }} failed their reset for 5 minutes, so their runner claims nothing for them. List them with psql as the exec_pool user on the queue's host, clear the cause on {{ $labels.host }}, then remove the runner's marker (runbook)."
          query: 'exec_pool_slots{job="node-exporter",host="{{ $labels.host }}",state="quarantined"} > 0'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#execpoolslotquarantined"

      - alert: ExecPoolQueuedWithIdleSlot
        # an idle slot polls every ten seconds and offers the task's agent, yet the task is not claimed
        expr: |
          max by (node) (exec_pool_queued_claimable_oldest_seconds{job="node-exporter"}) > 900
        for: 5m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "An execution pool task in the queue on {{ $labels.node }} waits beside an idle slot"
          description: "The oldest queued attempt in the queue on {{ $labels.node }} has waited {{ $value | humanizeDuration }} while a slot that offers its agent polls idle, so its claim keeps skipping it (its capabilities, a session pinned to another host, or a claim error). Read the idle slots' runner journals and the task's spec (runbook)."
          query: 'exec_pool_queued_claimable_oldest_seconds{job="node-exporter",node="{{ $labels.node }}"} > 900'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#execpoolqueuedwithidleslot"

      - alert: ExecPoolParkPushFailing
        # a park whose push failed keeps the turn's work in its slot's dock and quarantines the slot until it is pushed
        expr: |
          sum by (node) (increase(exec_pool_park_push_failures_total{job="node-exporter"}[1h])) >= 2
        for: 5m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "Parked session turns on {{ $labels.node }} cannot push their work"
          description: "{{ $value }} tries to push a parked session turn's work (its snapshot ref) from {{ $labels.node }} failed in the last hour. Read the exec helper's journal there for the git error and check the GitHub sidecar (runbook)."
          query: 'increase(exec_pool_park_push_failures_total{job="node-exporter",node="{{ $labels.node }}"}[1h])'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#execpoolparkpushfailing"

      - alert: ExecPoolPushesRefused
        # one refusal is the filter working; a slot that keeps trying is a task bent on a ref that is not its own
        expr: |
          sum by (node, slot) (increase(exec_pool_push_filter_pushes_total{job="node-exporter",result="refused"}[1h])) >= 3
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "Slot {{ $labels.slot }} on {{ $labels.node }} keeps pushing refs that are not its task's"
          description: "{{ $value }} git pushes from {{ $labels.slot }} on {{ $labels.node }} were refused by the push filter in the last hour. On {{ $labels.node }} run journalctl -u exec-pool-push-filter --since -1h for the refs it tried, and exec-pool list for the task in that slot (runbook)."
          query: 'increase(exec_pool_push_filter_pushes_total{job="node-exporter",node="{{ $labels.node }}",slot="{{ $labels.slot }}",result="refused"}[1h])'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#execpoolpushesrefused"

      - alert: ExecPoolSlotMemoryKills
        # the slots share the environments slice's one limit: a turn's nix eval meets it while its neighbours are busy
        expr: |
          sum by (node) (increase(exec_pool_memory_kills_total{job="node-exporter"}[2h])) >= 2
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "The kernel keeps killing processes in execution pool slots on {{ $labels.node }}"
          description: "{{ $value }} process(es) in the slots on {{ $labels.node }} were killed by the OOM killer at the slots' shared memory limit in the last 2 hours. On {{ $labels.node }} run journalctl -k -g oom-kill --since -2h for each killed task and its slot (task_memcg), and exec-pool list for sessions parked turn_memory_kill. From a slot, read only: the same kernel lines from Loki at LOKI_ADDR and each slot's memory in homelab_guest_memory_bytes (runbook)."
          query: 'increase(exec_pool_memory_kills_total{job="node-exporter",node="{{ $labels.node }}"}[2h])'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#execpoolslotmemorykills"

      - alert: ExecPoolPrepareFailing
        # each failed prepare requeues the task and spends a try: repeated, they end as attempts_exhausted
        expr: |
          sum by (node, step) (increase(exec_pool_prepare_failures_total{job="node-exporter"}[1h])) >= 3
        for: 5m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "Execution pool runs on {{ $labels.node }} keep failing at {{ $labels.step }}"
          description: "{{ $value }} run(s) on {{ $labels.node }} failed at {{ $labels.step }} before their agent started in the last hour; each requeues its task and spends a try. exec-pool result ID shows the step and its stderr (runbook)."
          query: 'increase(exec_pool_prepare_failures_total{job="node-exporter",node="{{ $labels.node }}"}[1h])'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#execpoolpreparefailing"

      - alert: ExecPoolSessionsLarge
        # the slots' docks, one session turn's checkout and home each (modules/workers/core.nix's dev-env-sessions-metrics)
        expr: |
          sum by (node) (homelab_dev_env_sessions_bytes{job="node-exporter"})
            / max by (node) (homelab_dev_env_sessions_filesystem_bytes{job="node-exporter"}) > 0.7
        for: 30m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "Session docks on {{ $labels.node }} fill most of the workers' state filesystem"
          description: "The slots' session docks on {{ $labels.node }} have held over 70% of the workers' state filesystem ({{ $value | humanizePercentage }}) for 30 minutes: running turns' build outputs, or docks kept after a failed park push. Run du -sh /var/lib/workers/.sessions/dock/* as root (runbook)."
          query: 'homelab_dev_env_sessions_bytes{job="node-exporter",node="{{ $labels.node }}"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#execpoolsessionslarge"

      - alert: ExecPoolSessionStalled
        # its automatic continues are spent (three in a row after errors, with a growing delay, or after timeouts), and
        # nothing in its inbox wakes it: only a message does. 5m keeps the page within 15 minutes of the stall, with
        # the minutely textfile, the scrape, the evaluation and Alertmanager's group_wait on top. One alert per
        # session (task): a second stall on the same host and reason pages on its own
        expr: |
          max by (host, reason, task) (exec_pool_session_stalled{job="node-exporter"}) > 0
        for: 5m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "Execution pool session {{ $labels.task }}, last run on {{ $labels.host }}, stopped after repeated {{ $labels.reason }} turns"
          description: "Session {{ $labels.task }}, last run on {{ $labels.host }}, has waited 5 minutes after its last turn parked as {{ $labels.reason }} with no automatic continue left, so nothing wakes it until you run exec-pool send {{ $labels.task }} --prompt TEXT. Read exec-pool status {{ $labels.task }} and exec-pool logs {{ $labels.task }} for what failed, fix the cause, then send it on with a prompt telling it what happened (runbook)."
          query: 'exec_pool_session_stalled{job="node-exporter",host="{{ $labels.host }}",reason="{{ $labels.reason }}",task="{{ $labels.task }}"} > 0'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#execpoolsessionstalled"

      - alert: ExecPoolCompactionWindowCostlier
        # 1.5x and 10 turns a side: a day's task mix alone moves cost per turn by less than half; the Shunt side is
        # left out, so only the window differs
        expr: |
          (
            host_variant:exec_pool_session_cost_usd:increase1d{variant!~"default|unknown",shunt="off"}
            / (host_variant:exec_pool_session_turns:increase1d{variant!~"default|unknown",shunt="off"} >= 10)
          )
          > on (host) group_left ()
          1.5 * (
            host_variant:exec_pool_session_cost_usd:increase1d{variant="default",shunt="off"}
            / (host_variant:exec_pool_session_turns:increase1d{variant="default",shunt="off"} >= 10)
          )
        for: 1h
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "Pool slots on {{ $labels.host }} with compaction window {{ $labels.variant }} cost over 1.5 times the default per turn"
          description: "Over the last day, Claude turns on {{ $labels.host }}'s slots with autoCompactWindow {{ $labels.variant }} cost {{ $value | printf \"%.2f\" }} USD each, over 1.5 times the default slots' there (Shunt off on both, at least 10 turns a side), for an hour. Read the comparison table in the Agent harnesses dashboard (Sessions row), then set that slot's autoCompactWindow back to null in the host's guest module and deploy (runbook)."
          query: 'host_variant:exec_pool_session_cost_usd:increase1d{host="{{ $labels.host }}",shunt="off"} / host_variant:exec_pool_session_turns:increase1d{host="{{ $labels.host }}",shunt="off"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#execpoolcompactionwindowcostlier"

      - alert: CodexLoginRefreshFailed
        # codex-egress-refresh (modules/workers/codex-auth.nix) never retries a failed refresh: the refresh token may be
        # spent, and a reused one fails for good. The expiry arm catches a timer that stopped running.
        expr: |
          max by (node) (codex_egress_refresh_failed{job="node-exporter"} == 1)
          or max by (node) (
            (codex_egress_access_token_expiry_timestamp_seconds{job="node-exporter"} - time() < 3600)
            and on (node) codex_egress_login_present{job="node-exporter"} == 1
          )
        for: 5m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "The pool's Codex login on {{ $labels.node }} failed to refresh"
          description: 'The owner''s ChatGPT login the egress proxy signs the slots'' Codex calls with on {{ $labels.node }} failed or timed out on its refresh, or its access token expires within the hour, and nothing retries it: Codex tasks there will fail with 401. Sign in again on {{ $labels.node }} as lukas, the login''s one writer: codex login --device-auth, which rewrites /home/lukas/.codex/auth.json (runbook).'
          query: 'codex_egress_refresh_failed{job="node-exporter",node="{{ $labels.node }}"} or codex_egress_access_token_expiry_timestamp_seconds{job="node-exporter",node="{{ $labels.node }}"} - time()'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#codexloginrefreshfailed"
