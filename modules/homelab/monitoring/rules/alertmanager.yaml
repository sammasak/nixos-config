# kube-prometheus-stack 85.0.3's alertmanager.rules, the chart's job selector replaced by the native job and
# descriptions naming instance, not namespace/pod (neither label exists off Kubernetes), less the cluster ones a single
# unclustered instance never fires or cannot deliver (alertmanager.nix asserts it stays one): members, config
# consistency, the cluster send failures (AlertmanagerFailedToSendAlerts, with one instance) and ClusterDown (the only
# instance down sends nothing; lenovo's cluster-watchdog pages a missing Watchdog). Each description ends with this
# fleet's first command.
# Each alert's query (docs/alert-runbooks.md) is a copy of its expr: change both.
groups:
  - name: alertmanager.rules
    rules:
      - alert: AlertmanagerFailedReload
        annotations:
          description: Configuration has failed to load for {{ $labels.instance }}. Run journalctl -u alertmanager --since -30m on black-pi for the error; the last good config keeps running.
          query: |-
            # Without max_over_time, failed scrapes could create false negatives, see
            # https://www.robustperception.io/alerting-on-gauges-in-prometheus-2-0 for details.
            max_over_time(alertmanager_config_last_reload_successful{job="alertmanager"}[5m]) == 0
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagerfailedreload
          summary: Reloading an Alertmanager configuration has failed.
        expr: |-
          # Without max_over_time, failed scrapes could create false negatives, see
          # https://www.robustperception.io/alerting-on-gauges-in-prometheus-2-0 for details.
          max_over_time(alertmanager_config_last_reload_successful{job="alertmanager"}[5m]) == 0
        for: 10m
        labels:
          severity: critical
      - alert: AlertmanagerFailedToSendAlerts
        annotations:
          description: Alertmanager {{ $labels.instance }} failed to send {{ $value | humanizePercentage }} of notifications to {{ $labels.integration }}, so those pages are lost. Run journalctl -u alertmanager --since -30m | grep -i notify on black-pi for the receiver's error, and check that ntfy answers.
          query: |-
            (
              rate(alertmanager_notifications_failed_total{job="alertmanager"}[15m])
            /
              ignoring (reason) group_left rate(alertmanager_notifications_total{job="alertmanager"}[15m])
            )
            > 0.01
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagerfailedtosendalerts
          summary: An Alertmanager instance failed to send notifications.
        expr: |-
          (
            rate(alertmanager_notifications_failed_total{job="alertmanager"}[15m])
          /
            ignoring (reason) group_left rate(alertmanager_notifications_total{job="alertmanager"}[15m])
          )
          > 0.01
        for: 5m
        labels:
          severity: warning
      - alert: AlertmanagerClusterCrashlooping
        annotations:
          description: '{{ $value | humanizePercentage }} of Alertmanager instances within the {{$labels.job}} cluster have restarted at least 5 times in the last 10m. Run journalctl -u alertmanager -b -n 100 on black-pi for why it exits.'
          query: |-
            (
              count by (namespace,service,cluster) (
                changes(process_start_time_seconds{job="alertmanager"}[10m]) > 4
              )
            /
              count by (namespace,service,cluster) (
                up{job="alertmanager"}
              )
            )
            >= 0.5
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/alertmanager/alertmanagerclustercrashlooping
          summary: Half or more of the Alertmanager instances within the same cluster are crashlooping.
        expr: |-
          (
            count by (namespace,service,cluster) (
              changes(process_start_time_seconds{job="alertmanager"}[10m]) > 4
            )
          /
            count by (namespace,service,cluster) (
              up{job="alertmanager"}
            )
          )
          >= 0.5
        for: 5m
        labels:
          severity: critical
