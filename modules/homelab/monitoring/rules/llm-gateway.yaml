# llm-gateway free-quota alerts, from homelab-gitops apps/monitoring-dashboards/llm-gateway-alerts.yaml.
# Metrics: sammasak/llm-gateway crates/gateway/src/metrics.rs; dashboard: ../dashboards/llm-gateway.json.
groups:
  - name: llm-gateway.alerts
    rules:
      # Every tier-2 quota group is under 10% of its daily allowance (a group
      # without a configured daily limit reports 1 until the provider says
      # it is exhausted, then 0). Tier 3 (msi) is the only floor left.
      - alert: LLMGatewayFreeFloorLow
        expr: |
          max(llm_gateway_quota_remaining_ratio{tier="free-floor"}) < 0.1
        for: 10m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "LLM gateway free floor is below 10% for the day"
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#llmgatewayfreefloorlow"
          query: 'llm_gateway_quota_remaining_ratio{tier="free-floor"}'
          description: "Every tier-2 (free floor) quota group has less than 10% of its daily free allowance left (best: {{ $value | humanizePercentage }}); it resets at 00:00 UTC. Requests fall to msi or get 429s. From lenovo, curl -s http://acer-swift:9091/status | jq .quota_groups names the spent group; https://grafana.sammasak.dev/d/llm-gateway shows the day."

      # The gateway is the only path to every cloud model and to Ollama for
      # keyed clients (Pi, Open WebUI, factum).
      - alert: LLMGatewayDown
        expr: |
          up{job="llm-gateway"} == 0 or absent(up{job="llm-gateway"})
        for: 5m
        labels:
          severity: critical
          team: homelab
        annotations:
          summary: "LLM gateway is down"
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#llmgatewaydown"
          query: 'up{job="llm-gateway"}'
          description: "{{ if eq $value 0.0 }}Prometheus on black-pi fails to scrape llm-gateway's admin port on acer (up=0){{ else }}Prometheus on black-pi has no llm-gateway target{{ end }} for 5m: Pi, Open WebUI and factum have no LLM path. Run systemctl status llm-gateway and journalctl -u llm-gateway --since -15m on acer."

  - name: llm-gateway.records
    rules:
      # Client requests Paddock on asus answered (llm-gateway-asus.toml's
      # asus-paddock provider), per project and outcome: the local-model line's
      # count (goals.md, #508). 0, not absent, while the gateway is scraped.
      - record: llm_gateway:paddock_requests:increase1d
        expr: |
          sum by (project, outcome) (increase(llm_gateway_requests_total{model=~"asus-paddock/.+"}[1d]))
          or on () (0 * max(up{job="llm-gateway"}))
