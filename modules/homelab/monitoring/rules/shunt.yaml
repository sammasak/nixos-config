# The Shunt collector's alerts (modules/homelab/shunt-metrics.nix). Each keys on the collector's own series or its
# unit, which exist only on a host that enables it and only while that host is scraped: a disabled or sleeping host
# never fires.
groups:
  - name: shunt.alerts
    rules:
      - alert: ShuntCollectorStale
        # 2700 s is three missed 15-minute runs; for 20m, longer than the first run after an enable takes, and two
        # failed runs in a row
        expr: |
          max by (node) (time() - shunt_collector_success_timestamp_seconds{job="node-exporter"} > 2700)
          or max by (node) (shunt_collector_failed{job="node-exporter"} == 1)
          or (
            max by (node) (node_systemd_unit_state{job="node-exporter",name="shunt-metrics.service",state="failed"})
            unless on (node) shunt_collector_success_timestamp_seconds{job="node-exporter"}
          )
        for: 20m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "The Shunt collector on {{ $labels.node }} is stale"
          description: "shunt-metrics on {{ $labels.node }} has not read the hook log successfully for over 45 minutes, its runs keep failing, or it has never written its textfile, so the Shunt panels and ShuntDelegationFailing are blind there. Run systemctl status shunt-metrics.service and journalctl -u shunt-metrics.service there."
          query: 'time() - shunt_collector_success_timestamp_seconds{job="node-exporter",node="{{ $labels.node }}"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#shuntcollectorstale"

      - alert: ShuntDelegationFailing
        # the counts are the collector's 24 h window; refusals (private, secret, sensitive, invalid) are policy, not
        # failures, and count only in the denominator
        expr: |
          (
            sum by (node) (shunt_events{job="node-exporter",hook="bulk-read",result=~"auth|rate_limited|model_unavailable|timeout|error"})
            / sum by (node) (shunt_events{job="node-exporter",hook="bulk-read"})
          ) > 0.25
          and on (node) sum by (node) (shunt_events{job="node-exporter",hook="bulk-read"}) >= 10
        for: 30m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "Bulk-read delegations on {{ $labels.node }} are failing"
          description: "{{ $value | humanizePercentage }} of the bulk-read delegations on {{ $labels.node }} in the last 24 h failed (auth, rate_limited, model_unavailable, timeout or error), over at least 10 attempts; sessions fall back to reading the files themselves. Read the outcomes in the hook log there."
          query: 'sum by (result) (shunt_events{job="node-exporter",node="{{ $labels.node }}",hook="bulk-read"})'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#shuntdelegationfailing"
