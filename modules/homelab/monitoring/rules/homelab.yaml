# The homelab's own rules, on the native node-exporter `up` and the blackbox probes.
groups:
  - name: host-health.alerts
    rules:
      # One series per node that may be off right now: a host the fleet
      # marks sleeps (modules/core/fleet.nix, the sleeps label on its
      # node-exporter target), at any time, except a host with a fleet power
      # window (power, minus power.manualOff): msi powers off Mon-Fri 21:00
      # and is woken Mon-Fri 08:30 Europe/Stockholm (modules/core/power-schedule.nix),
      # so off outside that window is an outage. asus-b460m has the same window
      # but sets power.manualOff: the owner also powers it off by hand, so it
      # stays planned-off at any time here.
      # PromQL time is UTC and has no time zone, so the window is the union of
      # both seasons, rendered by ./homelab.nix from the fleet facts (the
      # placeholder below): from the off hour minus 2 (19:00 UTC) to the wake
      # time read as UTC (08:30), plus Saturday and Sunday. That is one hour
      # early in winter evenings, and the wake time as UTC leaves the wake an
      # hour (winter) or two (summer) to bring the exporter up.
      # Recorded before the alerts below, which this group evaluates after it.
      - record: homelab:node:planned_off
        expr: |
          @PLANNED_OFF_EXPR@

      # A node whose node-exporter does not answer inside its planned power-off.
      # TargetDown (general.yaml) leaves its targets out, so a host that is up
      # keeps every target counted, and one off outside its plan is counted too.
      - record: homelab:node:off_as_planned
        expr: max by (node) (up{job="node-exporter"} == 0) and on (node) homelab:node:planned_off

      - alert: HostExpectedOff
        # The one signal for "this host is off and that is planned", per node.
        # Never notifies (null route); the Alertmanager inhibit rules keyed
        # on it silence what the powered-off host causes (../alertmanager.nix).
        # Fails open: it does not fire while any host is down outside its
        # plan, so those cases still notify.
        expr: |
          homelab:node:off_as_planned
          unless on () (
            count(max by (node) (up{job="node-exporter"} == 0) unless on (node) homelab:node:planned_off) > 0
          )
        for: 2m
        labels:
          severity: none
          team: homelab
        annotations:
          summary: "{{ $labels.node }} is off, as planned"
          description: "node-exporter on {{ $labels.node }} has not answered black-pi's scrape for 2 minutes, inside the host's planned power-off (homelab:node:planned_off). Source for the Alertmanager inhibit rules that silence what the power-off causes; not a notification."
          query: 'up{job="node-exporter",node="{{ $labels.node }}"} and on (node) homelab:node:planned_off{node="{{ $labels.node }}"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#hostexpectedoff"

      - alert: NodeChronicNotReady
        # a host off inside its plan (homelab:node:planned_off) is left out
        expr: up{job="node-exporter"} == 0 unless on (node) homelab:node:planned_off
        for: 15m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "Host {{ $labels.node }} has been unreachable for 15+ minutes"
          description: "Prometheus on black-pi has not scraped node-exporter on {{ $labels.node }} for 15 minutes: the host is down, off the LAN, or its exporter stopped. From lenovo, ping {{ $labels.node }} and ssh to it; there, systemctl status prometheus-node-exporter."
          query: 'up{job="node-exporter",node="{{ $labels.node }}"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#nodechronicnotready"

      - alert: GpuTelemetryDown
        # A GPU host that is up (its node-exporter answers) while its GPU
        # exporter does not: the driver or the exporter failed. Off, it says
        # nothing. It carries node, so another host's planned power-off does
        # not inhibit it.
        # for: under TargetDown's 10m, so inhibit rule 2 (../alertmanager.nix) mutes it before it notifies
        expr: max by (node) (up{job="nvidia-gpu"} == 0) and on (node) max by (node) (up{job="node-exporter"} == 1)
        for: 5m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "GPU telemetry on {{ $labels.node }} is down while the host is up"
          description: "black-pi has not scraped nvidia-gpu-exporter on {{ $labels.node }} for 5 minutes although its node-exporter answers. Check systemctl status prometheus-nvidia-gpu-exporter and nvidia-smi on the host, and its kernel journal for NVRM Xid lines."
          query: 'up{job=~"nvidia-gpu|node-exporter",node="{{ $labels.node }}"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#gputelemetrydown"

      # for: time for UnitOOMKilled's journal line to reach Loki's ruler; it inhibits this one (../alertmanager.nix)
      - alert: NodeOOMKill
        expr: increase(node_vmstat_oom_kill{job="node-exporter"}[15m]) > 0
        for: 2m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "The kernel OOM-killed a process on {{ $labels.node }}"
          description: "{{ $value | humanize }} OOM kill(s) on {{ $labels.node }} in the last 15 minutes. A unit at its MemoryMax or the host out of memory: run journalctl -k --since -1h | grep -i 'killed process' there for the process and its cgroup before raising any limit."
          query: 'increase(node_vmstat_oom_kill{job="node-exporter",node="{{ $labels.node }}"}[1h])'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#nodeoomkill"

      # The systemd collector reports services, sockets, timers, targets and paths; mounts and devices it leaves out.
      - alert: NodeSystemdUnitFailed
        expr: node_systemd_unit_state{job="node-exporter",state="failed"} == 1
        for: 15m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "{{ $labels.name }} failed on {{ $labels.node }}"
          description: "{{ $labels.name }} has been in the failed state on {{ $labels.node }} for 15 minutes. Run systemctl status {{ $labels.name }} and journalctl -u {{ $labels.name }} there; systemctl reset-failed clears it once fixed."
          query: 'node_systemd_unit_state{job="node-exporter",node="{{ $labels.node }}",state="failed"} == 1'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#nodesystemdunitfailed"

      # the Pi's zone against 85 °C, where its firmware throttles hardest. x86 zones are not paged: acer's package zone
      # sits near 89 °C through a build.
      - alert: NodeTemperatureHigh
        expr: node_thermal_zone_temp{job="node-exporter",type="cpu-thermal"} >= 85
        for: 15m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "{{ $labels.node }} runs hot"
          description: "{{ $labels.node }}'s {{ $labels.type }} zone has read {{ $value }} °C for 15 minutes, at the Pi's throttle point. Run cat /sys/class/thermal/thermal_zone*/temp there (millidegrees), then check the fan and airflow; https://grafana.sammasak.dev/d/hosts shows the hottest sensor."
          query: 'node_thermal_zone_temp{job="node-exporter",node="{{ $labels.node }}"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#nodetemperaturehigh"

      - alert: GpuThermalThrottling
        expr: nvidia_smi_clocks_event_reasons_hw_thermal_slowdown{job="nvidia-gpu"} == 1
        for: 10m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "The GPU on {{ $labels.node }} slows itself for heat"
          description: "The board on {{ $labels.node }} has reported hardware thermal slowdown for 10 minutes: model runs are slower than measured. Run nvidia-smi -q -d TEMPERATURE,PERFORMANCE there; the GPU dashboard shows its temperature, fan and power."
          query: 'nvidia_smi_temperature_gpu{job="nvidia-gpu",node="{{ $labels.node }}"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#gputhermalthrottling"

      # The fleet's resolver (adguardhome.nix), through adguard-textfile's minutely file on the DNS host.
      - alert: DnsDown
        expr: homelab_dns_up{job="node-exporter"} == 0
        for: 5m
        labels:
          severity: critical
          team: homelab
        annotations:
          summary: "AdGuard on {{ $labels.node }} is not answering its control API"
          description: "adguard-textfile on {{ $labels.node }} has found AdGuard down for 5 minutes: the LAN's DNS (and dns.sammasak.dev over TLS) is out. Run systemctl status adguardhome there."
          query: 'homelab_dns_up{job="node-exporter",node="{{ $labels.node }}"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#dnsdown"

      - alert: DnsStatsStale
        # the writer stopped (a failed run is NodeSystemdUnitFailed): DnsDown could not fire
        expr: time() - node_textfile_mtime_seconds{job="node-exporter",file=~".*/adguard[.]prom"} > 300
        for: 10m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "AdGuard's statistics on {{ $labels.node }} are stale"
          description: "adguard-textfile has not rewritten its file on {{ $labels.node }} for {{ $value | humanizeDuration }}, so DnsDown cannot see AdGuard. Check systemctl list-timers adguard-textfile there."
          query: 'time() - node_textfile_mtime_seconds{job="node-exporter",node="{{ $labels.node }}",file=~".*/adguard[.]prom"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#dnsstatsstale"

      - alert: InsideNamePublic
        # the inside names (sam.fleet.zone) have no Authentik: answered by a public resolver, they reach the LAN map
        expr: probe_dns_answer_rrs{job="inside-names-public"} > 0
        for: 15m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "An inside fleet name resolves on public DNS"
          description: "{{ $labels.instance }} answers the inside name black-pi asks it with {{ $value }} records: a public record exists under fleet.sammasak.dev, which only lenovo's AdGuard may answer. Delete it at Cloudflare."
          query: 'probe_dns_answer_rrs{job="inside-names-public"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#insidenamepublic"

      - alert: RootFilesystemLow
        # The 3 GB root floor (nixos-config#302): black-pi's SD card holds Prometheus and Loki.
        expr: node_filesystem_avail_bytes{job="node-exporter",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} < 3 * 1024 * 1024 * 1024
        for: 15m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "{{ $labels.node }} has under 3 GiB free on /"
          description: "{{ $value | humanize1024 }}B free on / of {{ $labels.node }}. Run df -h / and du -xsh /var/lib/* /nix/store 2>/dev/null | sort -h | tail there; on black-pi, Prometheus is capped at 1500MB, so check Loki's /var/lib/loki."
          query: 'node_filesystem_avail_bytes{job="node-exporter",node="{{ $labels.node }}",mountpoint="/"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#rootfilesystemlow"

      - alert: LokiIngesterDown
        expr: |
          absent(loki_ingester_streams_created_total) == 1
          or
          max(up{job="loki"}) == 0
        for: 5m
        labels:
          severity: critical
          team: homelab
        annotations:
          summary: "Loki ingester is not reporting metrics"
          description: "Loki on black-pi has stopped exporting ingester metrics or its scrape target is down. New logs cannot be persisted. Run: systemctl status loki on black-pi."
          query: 'up{job="loki"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#lokiingesterdown"

      # A host's own textfile series: an off host has none, so these carry node for HostExpectedOff's inhibit and need
      # no planned_off clause. A range vector still holds the samples from before a power-off, hence the up guard.
      - alert: JournalEntriesDropped
        expr: |
          increase(homelab_journal_writer_dropped_entries_total{job="node-exporter"}[15m]) > 0
          and on (node) max by (node) (up{job="node-exporter"} == 1)
        for: 5m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "Alloy on {{ $labels.node }} dropped journal entries ({{ $labels.reason }})"
          description: "Alloy's Loki writer on {{ $labels.node }} discarded {{ $value | humanize }} journal entries in the last 15 minutes with reason {{ $labels.reason }}: those lines never reach Loki. Run journalctl -u alloy --since -30m there."
          query: 'increase(homelab_journal_writer_dropped_entries_total{job="node-exporter",node="{{ $labels.node }}"}[1h])'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#journalentriesdropped"

      # 180 s: docs/journal-delivery-metrics.md's freshness bound for a minutely collector; for: outlasts a boot's
      # OnBootSec and the power-off, where Alloy stops before node-exporter
      - alert: JournalMetricsStale
        expr: |
          max by (node) (
            homelab_journal_metrics_collection_success{job="node-exporter"} == 0
            or time() - homelab_journal_metrics_collection_timestamp_seconds{job="node-exporter"} > 180
          )
          or (max by (node) (up{job="node-exporter"} == 1)
            unless on (node) homelab_journal_metrics_collection_timestamp_seconds{job="node-exporter"})
        for: 10m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "Journal delivery counters on {{ $labels.node }} are failing or stale"
          description: "journal-metrics on {{ $labels.node }} has had no successful collection from Alloy within 3 minutes, or no journal.prom at all, for 10 minutes, so JournalEntriesDropped cannot see that host's journal loss. Run systemctl status journal-metrics alloy there."
          query: '{__name__=~"homelab_journal_metrics_collection_.+",job="node-exporter",node="{{ $labels.node }}"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#journalmetricsstale"

      # dev-env-records (modules/workers/core.nix) runs every 5 minutes, at most 500 lines per worker: a run that gets
      # through refreshes the timestamp even with lines left, so 30 minutes is six runs that all failed
      - alert: GuestRecordsNotShipping
        expr: |
          max by (node, worker) (homelab_guest_records_waiting_lines{job="node-exporter"} > 0)
          and on (node, worker)
          max by (node, worker) (time() - homelab_guest_records_shipped_timestamp_seconds{job="node-exporter"} > 1800)
        for: 10m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "Platform records of worker {{ $labels.worker }} on {{ $labels.node }} are not shipping"
          description: "{{ $value }} platform record lines of worker {{ $labels.worker }} on {{ $labels.node }} are waiting and dev-env-records has not shipped any for over 30 minutes, so its gate and coverage records are missing from Loki. Run journalctl -u dev-env-records -n 20 on {{ $labels.node }}."
          query: '{__name__=~"homelab_guest_records_.+",job="node-exporter",node="{{ $labels.node }}",worker="{{ $labels.worker }}"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#guestrecordsnotshipping"

      # 36 h: every job runs daily (OnCalendar, Persistent), so this is one missed run, read the afternoon after it.
      # The timestamp exists only after a recorded success, and backup.prom is on tmpfs: the two alerts below cover a
      # backup with no recorded success and a collector that is stale or, after a reboot, never wrote.
      - alert: BackupStale
        expr: time() - homelab_backup_last_success_timestamp_seconds{job="node-exporter"} > 36 * 3600
        for: 10m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "Backup {{ $labels.backup }} on {{ $labels.node }} has not succeeded for {{ $value | humanizeDuration }}"
          description: "The last recorded success of {{ $labels.backup }} ({{ $labels.validation }}) on {{ $labels.node }} is {{ $value | humanizeDuration }} old, over 36 hours for a daily job. Run systemctl list-timers {{ $labels.backup }} and journalctl -u {{ $labels.backup }} -n 50 there."
          query: 'time() - homelab_backup_last_success_timestamp_seconds{job="node-exporter",node="{{ $labels.node }}"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#backupstale"

      # 0 also before a job's first instrumented run, at most a day: 36 h is a daily job that never recorded a success
      - alert: BackupNeverRecorded
        expr: homelab_backup_metadata_available{job="node-exporter"} == 0
        for: 36h
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "Backup {{ $labels.backup }} on {{ $labels.node }} has no recorded success"
          description: "backup-metrics on {{ $labels.node }} has found no valid success record for {{ $labels.backup }} ({{ $labels.validation }}) for 36 hours: the daily job has not completed, or its post-success record step failed. Run journalctl -u {{ $labels.backup }} -n 50 there."
          query: 'homelab_backup_metadata_available{job="node-exporter",node="{{ $labels.node }}"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#backupneverrecorded"

      # the hosts that register backup-metrics jobs (authentik, llm-gateway and open-webui on acer, authentik-offhost
      # on lenovo): a host with no backup.prom says nothing per backup, so its absence is matched by name
      - alert: BackupCollectorStale
        expr: |
          max by (node) (time() - homelab_backup_collector_last_success_timestamp_seconds{job="node-exporter"} > 900)
          or (max by (node) (up{job="node-exporter",node=~"acer-swift|lenovo-21CB001PMX"} == 1)
            unless on (node) homelab_backup_collector_last_success_timestamp_seconds{job="node-exporter"})
        for: 15m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "The backup-metrics collector on {{ $labels.node }} is stale or missing"
          description: "backup-metrics on {{ $labels.node }} has not completed a scan in 15 minutes, or has written no backup.prom since boot, for 15 minutes: BackupStale and BackupNeverRecorded cannot see that host's backups. Run systemctl status backup-metrics.timer backup-metrics there."
          query: 'time() - homelab_backup_collector_last_success_timestamp_seconds{job="node-exporter",node="{{ $labels.node }}"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#backupcollectorstale"

      # alloy-otlp's otelhttp request counter, by the status it answered: the receiver's refused and failed counters
      # stay 0 on a 401 or an oversized 400. A host relay's own 413 or 429 never reaches acer and has no metric.
      # Prometheus scrapes Alloy with allow-utf-8, so the OTel names keep their dots. POST only: the blackbox probe's
      # GET of /v1/logs is answered 401 all day.
      # 5m window under a 10m for: a single burst (a sender cut off mid-post at its power-off) cannot fire it
      - alert: OtlpWritesRejected
        expr: |
          sum by ("http.response.status_code") (
            increase({__name__="http.server.request.duration_seconds_count",job="alloy-otlp",component_id="otelcol.receiver.otlp.native","http.request.method"="POST","http.response.status_code"=~"[45].."}[5m])
          ) > 0
        for: 10m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: 'alloy-otlp on acer-swift is answering OTLP posts with {{ index $labels "http.response.status_code" }}'
          description: 'The OTLP receiver on acer answered {{ $value | humanize }} POSTs (metrics and logs from the host relays) with HTTP {{ index $labels "http.response.status_code" }} in the last 5 minutes, and has kept doing so for 10 minutes: those writes are lost while every scrape stays green. Run journalctl -u alloy-otlp --since -30m on acer.'
          query: 'sum by ("http.response.status_code") (increase({__name__="http.server.request.duration_seconds_count",job="alloy-otlp",component_id="otelcol.receiver.otlp.native","http.request.method"="POST"}[1h]))'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#otlpwritesrejected"

      # A compaction loop (#626): the Loki ruler's per-minute count of Claude Code's auto compactions
      # (../loki-rules/fake/homelab.yaml), summed over the last hour per host and worker. worker is empty for a session on
      # the host itself. 5 per hour is the issue's bound for the autoCompactWindow comparison; the count is a lower
      # bound (late lines are not counted), so it can only fire late, never early. keep_firing_for: a steady loop near
      # 6 an hour would otherwise resolve and fire again with each compaction.
      - alert: ClaudeCompactionLoop
        expr: |
          sum by (host, worker) (sum_over_time(host_worker:claude_code_auto_compactions:count1m[1h])) > 5
        keep_firing_for: 30m
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "Claude Code on {{ $labels.host }}{{ with $labels.worker }} worker {{ . }}{{ end }} is auto-compacting in a loop"
          description: "Claude Code on {{ $labels.host }}{{ with $labels.worker }} worker {{ . }}{{ end }} auto-compacted {{ $value }} times in the last hour, over 5: a session keeps refilling its context and compacting, losing its goal and spending cache tokens. In Grafana Explore on Loki, sum by (attributes_session_id) (count_over_time({observer=\"harness\", service_name=\"claude-code\", event_name=\"compaction\", host_name=\"{{ $labels.host }}\"} | json | attributes_trigger=\"auto\" | attributes_worker=\"{{ $labels.worker }}\" [1h])) names the session: one with most of them is the loop, stop it (a pool slot's: exec-pool list); many with a few each is load. Do so before changing its autoCompactWindow."
          query: 'sum_over_time(host_worker:claude_code_auto_compactions:count1m{host="{{ $labels.host }}",worker="{{ $labels.worker }}"}[1h])'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#claudecompactionloop"

      # Caddy's unix upstreams on acer (open-webui.nix's edge check): the probe above sees only forward auth's 302
      - alert: EdgeSocketDown
        # absent: a check that never ran (timer dead, the directory missing after a reboot) writes no series at all
        # unless: acer's exporter down is NodeChronicNotReady's page, not this one
        expr: (homelab_edge_socket_listening == 0 or time() - node_textfile_mtime_seconds{file=~".*/open-webui-edge\\.prom"} > 300 or absent(node_textfile_mtime_seconds{file=~".*/open-webui-edge\\.prom"})) unless on () up{job="node-exporter", instance="acer-swift"} == 0
        for: 2m
        labels:
          severity: critical
          team: homelab
        annotations:
          summary: "Caddy's upstream socket on acer-swift is not listening"
          description: "Nothing listens on the edge socket, or the check stopped writing (stale for 5 min), so signed-in users get a 502. Run on acer: systemctl restart open-webui-proxy-rebind (it stops the proxy first, or the socket refuses to start); then check systemctl status open-webui-edge-check.timer."
          query: 'homelab_edge_socket_listening or time() - node_textfile_mtime_seconds{file=~".*/open-webui-edge[.]prom"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#edgesocketdown"

      # The two below come from black-pi's probes of the public names through Caddy (../prometheus.nix).
      - alert: AppDown
        expr: probe_success{job="blackbox"} == 0
        for: 5m
        labels:
          severity: critical
          team: homelab
        annotations:
          summary: "{{ $labels.instance }} is down"
          description: "The HTTPS probe from black-pi to {{ $labels.instance }} has failed for 5 minutes: a refused connection, a bad certificate, or a status outside the module's list. Check http://prometheus.fleet.sammasak.dev:9090/targets?search=blackbox."
          query: 'probe_http_status_code{job="blackbox",instance="{{ $labels.instance }}"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#appdown"

      - alert: CertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="blackbox"} - time() < 14 * 86400
        for: 1h
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "TLS certificate of {{ $labels.instance }} expires in {{ $value | humanizeDuration }}"
          description: "black-pi's HTTPS probe of {{ $labels.instance }} has seen a certificate expiring in under 14 days for an hour: no renewed certificate is being served. Run journalctl -u caddy --since -1d | grep -i acme on acer for the renewal's error."
          query: '(probe_ssl_earliest_cert_expiry{job="blackbox",instance="{{ $labels.instance }}"} - time()) / 86400'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#certificateexpiringsoon"

  - name: homelab.health.kpi
    interval: 1m
    rules:
      # node_ready_ratio and target_up_ratio leave out the hosts HostExpectedOff fires for.
      - record: homelab:health:node_ready_ratio
        expr: |
          sum(up{job="node-exporter"} unless on(node) ALERTS{alertname="HostExpectedOff",alertstate="firing"})
          /
          count(up{job="node-exporter"} unless on(node) ALERTS{alertname="HostExpectedOff",alertstate="firing"})
      - record: homelab:health:firing_critical
        expr: count(ALERTS{alertstate="firing",severity="critical"}) or vector(0)
      - record: homelab:health:min_disk_free_ratio
        expr: |
          min(
            node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}
            /
            node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}
          )
      - record: homelab:health:target_up_ratio
        expr: |
          sum(up unless on(node) ALERTS{alertname="HostExpectedOff",alertstate="firing"})
          /
          count(up unless on(node) ALERTS{alertname="HostExpectedOff",alertstate="firing"})
      - record: homelab:health:deadman_alive
        expr: count(ALERTS{alertname="Watchdog",alertstate="firing"}) or vector(0)
      # Composite score (0-100): each KPI thresholded to 0/1, averaged over 5.
      - record: homelab:health:score
        expr: |
          100 / 5 * (
              (homelab:health:node_ready_ratio    >= bool 1)
            + (homelab:health:target_up_ratio     >= bool 0.95)
            + (homelab:health:firing_critical     <= bool 0)
            + (homelab:health:min_disk_free_ratio >= bool 0.15)
            + (homelab:health:deadman_alive       >= bool 1)
          )

  - name: host-health.recordings
    rules:
      - record: homelab:node:cpu_accounting_rate
        expr: |
          sum by (node) (rate(node_cpu_seconds_total{job="node-exporter",mode!~"guest.*"}[5m]))
          / count by (node) (node_cpu_seconds_total{job="node-exporter",mode="idle"})
