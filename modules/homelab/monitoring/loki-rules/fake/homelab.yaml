# Loki's ruler on black-pi (homelab.loki.ruler, modules/homelab/loki.nix) evaluates these LogQL rules: the recordings
# go to Prometheus by remote write, the alerts to Alertmanager. `fake` is the tenant Loki uses without auth_enabled.
groups:
  - name: harness.compactions
    interval: 1m
    rules:
      # Claude Code's automatic compactions per host and worker, from the sanitized OTLP events (alloy-otlp).
      # worker is the host relay's stamp, empty for a session on the host itself. Each minute is counted once, so
      # sum_over_time(...[1d]) is a lower bound: a line later than the offset (alloy-otlp's queue replaying after an
      # outage) or a minute Loki was down is never counted; for an exact total query Loki. No events, no sample.
      - record: host_worker:claude_code_auto_compactions:count1m
        expr: |
          sum by (host, worker) (
            count_over_time(
              {observer="harness", service_name="claude-code", event_name="compaction"}
                | json worker="attributes.worker", trigger="attributes.trigger"
                | trigger="auto"
                | label_format host="{{ .host_name }}"
              # the minute before last, so a line pushed up to a minute late is counted (Loki drops a group's
              # query_offset)
              [1m] offset 1m
            )
          )

  - name: egress.codex
    interval: 1m
    rules:
      # The slots' Codex calls the egress proxy answered with no success, by host and status: 429 is the ChatGPT
      # plan's usage limit (or a rate limit), passed to the slot as it is and never retried. The journal collector
      # drops 2xx/3xx access lines, so successes are exec_pool_attempts'. Each minute is counted once, as above.
      - record: host_status:codex_egress_refusals:count1m
        expr: |
          sum by (host, status) (
            count_over_time(
              {job="host-journal", unit="dev-env-egress.service"}
                |= "http.log.access."
                | json logger="logger", status="status"
                | logger=~"http[.]log[.]access[.](openai-.+|codex-fleet)"
                | status=~"[45].."
              [1m] offset 1m
            )
          )

  - name: journal.alerts
    rules:
      # systemd's line when a unit's cgroup sees OOM kills, at its own MemoryMax or for the whole host (several kills
      # between its reads are one line); NodeOOMKill counts the kills without naming the unit. PID 1's lines ship as
      # unit="init.scope"; oom_unit is folded as the journal collector folds unit, so the query matches its stream.
      - alert: UnitOOMKilled
        expr: |
          sum by (node, oom_unit) (
            label_replace(label_replace(label_replace(
              count_over_time(
                {job="host-journal", unit="init.scope"}
                  |= "of this unit has been killed by the OOM killer"
                  | regexp `^(?P<oom_unit>[^ :]+): A process of this unit has been killed by the OOM killer`
                  | label_format node="{{ .host }}"
                [15m]
              ),
              "oom_unit", "transient", "oom_unit", "run-.+[.](scope|service)"),
              "oom_unit", "session", "oom_unit", "session-.+[.]scope"),
              "oom_unit", "systemd-coredump", "oom_unit", "systemd-coredump@.+[.]service"
            )
          ) > 0
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "The OOM killer hit {{ $labels.oom_unit }} on {{ $labels.node }}"
          description: "systemd logged {{ $value }} OOM event(s) in {{ $labels.oom_unit }} on {{ $labels.node }} in the last 15 minutes: the unit at its MemoryMax or the host out of memory. Read that unit's journal before raising any limit."
          query: '{job="host-journal", host="{{ $labels.node }}", unit=~"init.scope|{{ $labels.oom_unit }}"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#unitoomkilled"
