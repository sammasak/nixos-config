# Loki's ruler on black-pi (homelab.loki.ruler, modules/homelab/loki.nix) evaluates these LogQL rules: the recordings
# go to Prometheus by remote write, the alerts to Alertmanager. `fake` is the tenant Loki uses without auth_enabled.
groups:
  - name: harness.compactions
    interval: 1m
    # a line pushed up to a minute late still lands in its one-minute window
    query_offset: 1m
    rules:
      # Claude Code's automatic compactions per host and worker (#626), from the sanitized OTLP events (alloy-otlp).
      # worker is the host relay's stamp, empty for a session on the host itself. One minute per evaluation, so
      # sum_over_time(...[1d]) is a day's count; a minute with none writes no sample.
      - record: host_worker:claude_code_auto_compactions:count1m
        expr: |
          sum by (host, worker) (
            count_over_time(
              {observer="harness", event_name="compaction"}
                | json worker="attributes.worker", trigger="attributes.trigger"
                | trigger="auto"
                | label_format host="{{ .host_name }}"
              [1m]
            )
          )

  - name: journal.alerts
    rules:
      # systemd's line for every process the kernel kills in a unit's cgroup, at its own MemoryMax or for the whole
      # host; NodeOOMKill counts the same kills without naming the unit. PID 1's lines ship as unit="init.scope".
      - alert: UnitOOMKilled
        expr: |
          sum by (node, oom_unit) (
            label_replace(
              count_over_time(
                {job="host-journal", unit="init.scope"}
                  |= "of this unit has been killed by the OOM killer"
                  | regexp `^(?P<oom_unit>[^ :]+): A process of this unit has been killed by the OOM killer`
                  | label_format node="{{ .host }}"
                [15m]
              ),
              "oom_unit", "transient", "oom_unit", "run-.+"
            )
          ) > 0
        labels:
          severity: warning
          team: homelab
        annotations:
          summary: "The OOM killer hit {{ $labels.oom_unit }} on {{ $labels.node }}"
          description: "systemd logged {{ $value }} OOM kill(s) in {{ $labels.oom_unit }} on {{ $labels.node }} in the last 15 minutes: the unit at its MemoryMax or the host out of memory. Read that unit's journal before raising any limit."
          query: '{job="host-journal", host="{{ $labels.node }}", unit=~"init.scope|{{ $labels.oom_unit }}"}'
          runbook_url: "https://github.com/sammasak/nixos-config/blob/main/docs/alert-runbooks.md#unitoomkilled"
