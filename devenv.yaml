require_version: ">=2.4.0"

inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  platform:
    # Do not bump to 2cf12c7 or later until sammasak/devenv-platform#131 is fixed:
    # from there the pre-push guard ignores core.hooksPath and refuses every push here.
    url: git+ssh://git@github.com/sammasak/devenv-platform?rev=1034f68be541a48125e8455359de5c579cafc857
    flake: false
  git-hooks:
    url: github:cachix/git-hooks.nix/27555e2624241fb116b49095df4caaee85a25691
    inputs:
      nixpkgs:
        follows: nixpkgs
  # Same rev as flake.lock: the deploy CLI must match the activation side.
  deploy-rs:
    url: github:serokell/deploy-rs/45ba3f8c5cb28396fff71671806e2550b464ac86
